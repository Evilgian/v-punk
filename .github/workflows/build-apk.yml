name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "vpunkrelease"
          export/android/debug_keystore_pass = "vpunk2026"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v2.1.${{ github.run_number }}"
          VERSION_NAME="2.1.${{ github.run_number }}"
          VERSION_CODE=$((200 + ${{ github.run_number }}))
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v2.1.${{ github.run_number }}-APK
          path: build/android/V-Punk-v2.1.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: "V-PUNK: Rogue Protocol — Release v2.1.${{ github.run_number }}"
          make_latest: true
          body: |
            ### V-PUNK: Rogue Protocol — Versione `v2.1.${{ github.run_number }}` (Cyberpunk 2077 Visual & 12-Worlds Overhaul)

            #### 1. Vera Estetica Dark-Cyberpunk HD & Tipografia Tecnica (`Chakra Petch`)
            - **Nuovi Sfondi HD per tutti i 12 Mondi (`800x450`) & Fondale Night City**: eliminata completamente la vecchia estetica anni '80 a griglie wireframe a bassa risoluzione; ogni Settore ha ora un fondale 3D Cyberpunk ad alta definizione coerente con i modelli HD dei personaggi.
            - **UI Asimmetrica Cyberpunk 2077**: nuove placche in ossidiana opaca con angoli vivi a `90°`, taglio chirurgico a `45°` in basso a destra, barre laterali neon `#FF003C` / `#00F0FF` e pulsanti primari Giallo Acido `#FCEE0A` con testo nero ad altissimo contrasto.
            - **Font Cyberpunk Dedicato (`Chakra Petch Bold / SemiBold`)**: installata tipografia geometrica sci-fi su tutta l'interfaccia, HUD e numeri di danno in combattimento.

            #### 2. 12 Settori Cyberpunk, Selezione Mondo Interattiva & Premi a Soglie
            - **Espansione a 12 Mondi (`Settori 01–12`)**: aggiunti *Vicolo Kabuki*, *Bastione Militech*, *Reattore Abissale*, *Cupola Selene* e *Nucleo A.R.G.O.N.*, ciascuno con mix ostili dedicati, Boss 3D ed emblema reattore in-game.
            - **Mappa Tattica Interattiva a 12 Nodi + Swipe Touch**: selettore rapido dei 12 Settori collegati, scorrimento touch sul diorama HD, silhouette criptate per i bersagli bloccati (zero muri di testo spoiler) e scheda `[ INTEL ]` consultabile a richiesta.
            - **Premi Intermedi a Soglie in Ogni Mondo (`36 Casse Traguardo`)**: barra di avanzamento per ogni Settore con **3 soglie riscattabili** (`30%`, `65%`, `100%` delle Zone raggiunte) che premiano con Crediti, Gemme, Nuclei e Cromo Raro/Epico anche prima di battere il Boss finale.

            #### 3. Lessico Immersivo & Arena Gunmetal HD
            - **Terminologia Diegetica Concisa**: testi snelli e immersivi (`AVVIA INCURSIONE »`, `MERCATO`, `CROMO`, `SINAPSI`, `CONTRATTI`, `CALIBRA`, `SINTESI`, `MK.I–MK.IV`).
            - **Arena In-Game Acciaio Brunito**: nuova pavimentazione industriale scura ad alto contrasto che valorizza personaggi, boss e proiettili neon.

            ---
            **Installazione / Aggiornamento**: scarica **`V-Punk-v2.1.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android e aprilo per aggiornare direttamente l'app mantenendo tutti i tuoi salvataggi (`versionCode` incrementato con keystore permanente).
          files: |
            build/android/V-Punk-v2.1.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
