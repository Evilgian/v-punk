name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Genera Debug Keystore per firma APK
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Installa Godot ${{ env.GODOT_VERSION }} & Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: true
          use-dotnet: false

      - name: Configura Editor Settings per Android SDK e Keystore
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres

      - name: Importa Risorse & Compila V-Punk.apk
        run: |
          mkdir -p build/android
          # Allinea il tag versione per il runner cloud Godot 4.3
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot
          godot --headless --import
          godot --headless --export-debug "Android" build/android/V-Punk.apk

      - name: Carica V-Punk.apk negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-Android-APK
          path: build/android/V-Punk.apk

      - name: Pubblica V-Punk.apk nella sezione Releases di GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "V-PUNK: Rogue Protocol — Ultima Build APK"
          body: |
            ### ⚡ V-PUNK: Rogue Protocol (Android APK)
            Scarica **`V-Punk.apk`** qui sotto sul tuo smartphone Android ed aprilo per installare e giocare!
          files: build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
