name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "vpunkrelease"
          export/android/debug_keystore_pass = "vpunk2026"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v2.2.${{ github.run_number }}"
          VERSION_NAME="2.2.${{ github.run_number }}"
          VERSION_CODE=$((300 + ${{ github.run_number }}))
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v2.2.${{ github.run_number }}-APK
          path: build/android/V-Punk-v2.2.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: "V-PUNK: Rogue Protocol — Release v2.2.${{ github.run_number }}"
          make_latest: true
          body: |
            ### V-PUNK: Rogue Protocol — Versione `v2.2.${{ github.run_number }}` (Operativi Cyberpunk, Skin con Perk, Arene Urbane HD & Fix Cromo)

            #### 1. Nuovo Protagonista Cyberpunk ("V-Runner") & 5 Skin Giocabili con Perk Unici
            - **Addio Armatura da Samurai**: nuovo protagonista *Cyberpunk 2077* in giubbotto bomber in pelle con colletto neon illuminato, visore LED e braccio cibernetico cromato, completo di rig articolato su 3 viste (`front / side / back`).
            - **Sistema Skin Operativi con Abilità Passive (`CROMO -> SKIN`)**: 5 personaggi Cyberpunk giocabili (*V-Runner*, *Ghost Netrunner*, *Neon Rebel*, *Trauma Valkyrie*, *Chrome Overlord*), ciascuno con bonus passivi esclusivi in partita (`+Velocità/Crediti`, `+Cadenza/EXP`, `+Critico/Danno Crit`, `+HP/Rigenerazione`, `+ATK/HP/Scudo`).
            - **Doppio Sistema di Sblocco**: ogni Skin si sblocca gratuitamente man mano che avanzi nei Settori (`02`, `04`, `07`, `10`) oppure istantaneamente tramite Gemme o Bundle VIP nel `MERCATO`.

            #### 2. Arene di Gioco 2.5D Cyberpunk in Alta Definizione & Prop Urbani 3D
            - **4 Nuove Arene 2.5D Fotorealistiche coerenti coi 12 Mondi**: strade di Night City bagnate dalla pioggia con strisce pedonali, pozzanghere neon e marciapiedi, impianti Biotechnica con griglie e tubature bio-luminescenti, fonderie/Badlands con canali al plasma fuso e caveau hi-tech Arasaka, integrate con lo skyline HD del Settore scelto.
            - **Ostacoli Urbani 3D Variati**: distributori olografici neon, auto volanti della polizia cyber, barricate laser Militech e capsule bio-criogeniche.

            #### 3. Fix Schermata Equipaggiamento (`CROMO`) & Scroll Touch Mobile
            - **Zero Sovrapposizioni al Cambio Arma**: rimozione immediata dei nodi precedenti negli slot attivi e nella scheda oggetto.
            - **Scorrimento Touch Fluido**: le card dell'inventario lasciano scorrere liberamente la lista al trascinamento verticale e aprono l'oggetto solo al tocco netto.
            - **Chiara Distinzione per Categoria**: barra filtri (`TUTTI` | `⚔ ARMI` | `🛡 CORAZZE` | `◎ ANELLI` | `✦ DRONI`), ordinamento automatico e badge categoria colorati su ogni oggetto e slot.

            ---
            **Installazione / Aggiornamento**: scarica **`V-Punk-v2.2.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android e aprilo per aggiornare direttamente l'app mantenendo tutti i salvataggi (`versionCode` incrementato con keystore permanente).
          files: |
            build/android/V-Punk-v2.2.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
