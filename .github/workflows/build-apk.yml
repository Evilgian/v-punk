name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "vpunkrelease"
          export/android/debug_keystore_pass = "vpunk2026"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v2.3.${{ github.run_number }}"
          VERSION_NAME="2.3.${{ github.run_number }}"
          VERSION_CODE=$((400 + ${{ github.run_number }}))
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v2.3.${{ github.run_number }}-APK
          path: build/android/V-Punk-v2.3.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: "V-PUNK: Rogue Protocol — Release v2.3.${{ github.run_number }}"
          make_latest: true
          body: |
            ### V-PUNK: Rogue Protocol — Versione `v2.3.${{ github.run_number }}` (Fix Touch Tab Inferiori, Modelli 3D Integri & Animazioni Vive Personaggio)

            #### 1. Ripristino Immediato Tab Inferiori & Scorrimento Touch su Android
            - **Fix Conflitto Touch/Mouse nelle Tab di Navigazione**: risolto il blocco dei tocchi sulle 5 tab inferiori (`MERCATO`, `CROMO`, `INCURSIONE`, `SINAPSI`, `CONTRATTI`) e sulla barra superiore causato dalla doppia emissione `ScreenTouch + EmulatedMouse` su Android, mantenendo al contempo lo scorrimento fluido nelle liste con pulsanti nativi C++ `ACTION_MODE_BUTTON_RELEASE`.

            #### 2. Modelli 3D In-Game 100% Integri (Zero Bordi Tagliati)
            - **Auto della Polizia Cyber & Coperture Urbane `256x256` Complete**: rigenerati tutti i prop 3D (`prop_cybercar`, `prop_barricade`, `prop_vending`, `prop_biopod`) con proporzioni `1:1` centrate e margine trasparente di sicurezza, eliminando qualsiasi taglio laterale.

            #### 3. Personaggio Vivo e Reattivo (Idle, Sparo, Menu e Corsa)
            - **Guardia Attiva & Respirazione**: anche da fermo (nei menu o mentre mira e spara in partita) l'operativo mantiene una postura atletica viva con respiro toracico, molleggio sulle ginocchia, spostamento del peso e rinculo fisico sincronizzato a ogni colpo esploso.

            ---
            **Installazione / Aggiornamento**: scarica **`V-Punk-v2.3.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android e aprilo per aggiornare direttamente l'app mantenendo tutti i salvataggi (`versionCode` incrementato).
          files: |
            build/android/V-Punk-v2.3.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
