name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "vpunkrelease"
          export/android/debug_keystore_pass = "vpunk2026"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v2.0.${{ github.run_number }}"
          VERSION_NAME="2.0.${{ github.run_number }}"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v2.0.${{ github.run_number }}-APK
          path: build/android/V-Punk-v2.0.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "V-PUNK: Rogue Protocol — Release v2.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### V-PUNK: Rogue Protocol — Versione `v2.0.${{ github.run_number }}` (Major Overhaul Android APK)

            #### 1. Nuova Interfaccia 3D Moderna & Gestione Spazi Mobile (16:9 - 21:9)
            - **Pulsanti 3D Tattili Spessi & Smussati**: sostituite tutte le vecchie barre sottili con vere placche 3D cyber-smussate ad alto spessore, selettori segmentati unificati (`Arsenale / Officina / Fusione` e `Giornaliere / Settimanali / Mensili`) e contatori risorse in vetro scuro.
            - **Layout Full-Screen Bilanciato**: la schermata Home si adatta all'intera altezza dello smartphone con un grande diorama 3D Settore/Boss, vetrina equipaggiamento pulita e pulsante principale `GIOCA CAPITOLO` ad alto impatto in basso; griglia Arsenale a **3 colonne** in stile RPG moderno (1 tocco per aprire scheda dettagliata, equipaggiare o potenziare).
            - **Schermata d'Ingresso Cinematografica Full-Bleed**: nuovo poster verticale 21:9 a tutto schermo (`edge-to-edge`, zero bande nere sopra o sotto), pioggia neon animata, riflettori volumetrici e palco olografico 3D dell'Operativo.

            #### 2. Corsa Atletica 3D & Impugnatura Armi Realistica
            - **Locomozione Dinamica in Gioco**: durante lo spostamento col joystick il personaggio ruota istantaneamente nella direzione di corsa con falcata ampia a 2 snodi, sollevamento ginocchia, rimbalzo elastico e oscillazione coordinata di braccia e arma, tornando a puntare il nemico appena ci si ferma per sparare.
            - **Rig Anatomici Dedicati**: gambe e busti separati per Mech e Boss bipedi, andatura aracnide per Mantis/Scorpioni e torrette rotanti indipendenti.

            #### 3. 7 Archetipi di Nemici, 8 Boss 3D Unici & Bilanciamento Armi
            - **Nuovi Ostili**: *Ticker Kamikaze Bot*, *Aegis Riot Enforcer* (scudo frontale direzionale), *Cyber-Wraith Assassin* e *Bio-Cryo Spitter Turret*, distribuiti progressivamente nei Mondi 1–8.
            - **8 Boss 3D Inediti**: modelli 3D dedicati per ciascuno degli 8 mondi con telegrafi d'attacco a terra e barra Boss HUD non sovrapposta.
            - **Armi Ribilanciate**: onda d'urto perforante da `130px` per la *Katana Cyber*, esplosione AoE da `84px` per il *Cannone al Plasma* e progressione DPS coerente con la rarità (`Comune < Raro < Epico < Leggendario`).

            ---
            **Installazione / Aggiornamento**: scarica **`V-Punk-v2.0.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android e aprilo per aggiornare direttamente l'app mantenendo tutti i tuoi salvataggi (`versionCode` incrementato con keystore permanente).
          files: |
            build/android/V-Punk-v2.0.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
