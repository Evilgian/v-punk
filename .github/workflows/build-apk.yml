name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "vpunkrelease"
          export/android/debug_keystore_pass = "vpunk2026"
          EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v2.8.${{ github.run_number }}"
          VERSION_NAME="2.8.${{ github.run_number }}"
          VERSION_CODE=$((900 + ${{ github.run_number }}))
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v2.8.${{ github.run_number }}-APK
          path: build/android/V-Punk-v2.8.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.${{ github.run_number }}
          name: "V-PUNK: Rogue Protocol — Release v2.8.${{ github.run_number }}"
          make_latest: true
          body: |
            ### V-PUNK: Rogue Protocol — Versione `v2.8.${{ github.run_number }}` (Scroll Fluido in Sinapsi & Tutte le Tab, Ribilanciamento Difficoltà/Economia & UI Visuale Mercato/Sinapsi)

            #### 1. Scorrimento Touch Fluido Ovunque (`SINAPSI`, `MERCATO`, `CALIBRA`, `SINTESI`, `CONTRATTI`)
            - **Zero Blocchi allo Swipe Verticale**: eliminato `MOUSE_FILTER_STOP` da card, contenitori e pulsanti dinamici dentro `ScrollContainer` (ora tutti usano `MOUSE_FILTER_PASS` + `ACTION_MODE_BUTTON_RELEASE` con `scroll_deadzone` ottimizzato), rendendo lo scorrimento verso il basso e verso l'alto immediato anche iniziando il trascinamento sopra una card o un bottone.

            #### 2. Ribilanciamento Profondo di Difficoltà, Economia & Costi (Settori 1–12)
            - **Economia & Costi Esponenziali**: introdotta curva esponenziale sui costi in Oro/Nuclei di **Calibrazione** (fino a Lv.20) e **Sinapsi**, riducendo l'inflazione di monete/gemme a fine run per dare vero peso ad ogni potenziamento.
            - **Sfida Tattica Reale (Mondo 5 e oltre)**: innalzati esponenzialmente HP, danni, velocità proiettili e densità ostili dal Settore 2 al 12, con adattamento anti-oneshot su mob, Élite e Boss anche per chi possiede già equipaggiamento Epico/Leggendario molto potenziato, e tetti bilanciati a Schivata/Riduzione Danni.

            #### 3. Restyling Visuale & Compatto di `MERCATO`, `SINAPSI` e Sotto-Schede
            - **Mercato Visuale**: rimossi i muri di testo in favore di 2 grandi card Casse 3D affiancate, barra compatta Gemme Gratis, banner Operativi con ritratti 3D e 3 tile visuali Gemme con cristalli disegnati.
            - **Griglia Sinapsi 3 Colonne Stile *Archero***: 14 medaglioni iconici dedicati con livello, bonus secco (`+ATK`, `+HP`, `%`) e bottone prezzo compatto senza frasi ridondanti.

            ---
            **Installazione / Aggiornamento**: scarica **`V-Punk-v2.8.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android e aprilo per aggiornare direttamente l'app mantenendo tutti i salvataggi (`versionCode` incrementato).
          files: |
            build/android/V-Punk-v2.8.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
