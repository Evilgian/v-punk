name: Build Android APK (V-PUNK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-android:
    name: Esporta APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scarica e Installa Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configura Editor Settings e Keystore Permanente per Android
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          mkdir -p ~/.android
          # Utilizza il keystore permanente versionato nel repository
          cp keystore/release.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "vpunkrelease"
export/android/debug_keystore_pass = "vpunk2026"
EOF
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Imposta Versione Build & Compila APK Android
        run: |
          mkdir -p build/android
          VERSION_TAG="v1.5.${{ github.run_number }}"
          VERSION_NAME="1.5.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          echo "Compilazione versione: $VERSION_TAG (code: $VERSION_CODE)"

          sed -i "s/const GAME_VERSION: String = \".*\"/const GAME_VERSION: String = \"$VERSION_TAG\"/g" scripts/global.gd
          sed -i "s/version\/code=.*/version\/code=$VERSION_CODE/g" export_presets.cfg
          sed -i "s/version\/name=\".*\"/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg
          sed -i 's/"4.7"/"4.3"/g' project.godot
          sed -i 's/"4.6"/"4.3"/g' project.godot

          godot --headless --import || true
          godot --headless --export-debug "Android" "build/android/V-Punk-$VERSION_TAG.apk"
          cp "build/android/V-Punk-$VERSION_TAG.apk" "build/android/V-Punk.apk"
          ls -lh build/android/

      - name: Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V-Punk-v1.5.${{ github.run_number }}-APK
          path: build/android/V-Punk-v1.5.${{ github.run_number }}.apk

      - name: Pubblica Release Versionata su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "⚡ V-PUNK: Rogue Protocol — Release v1.5.${{ github.run_number }}"
          make_latest: true
          body: |
            ### ⚡ V-PUNK: Rogue Protocol — Versione `v1.5.${{ github.run_number }}` (Android APK)
            - **Firma Digitale Permanente (Keystore Fisso)**: Configurato il keystore crittografico permanente. Da questa release (`v1.5.${{ github.run_number }}`) in poi, tutti gli aggiornamenti futuri si installeranno direttamente sopra la versione esistente senza errori di conflitto firma!
            - **Personaggio & Boss 3D Aggressivi & Dettagliati**: Nuovo modello Cyber-Ronin Exo-Slayer con elmo cornuto, visiera neon a V, armature a piastre metalliche e locomozione articolata; Boss Robo-Titan ridisegnato come Dreadnought mecha con teschio cornuto, fornace ardente e lanciamissili; nemici 3D potenziati (Mantis Stalker, Hover-Wasp, Goliath).
            - **Visibilità Cristallina & Nessuna Opacità**: Rimosse le doppie vignettature scure e il bloom eccessivo che causava l'effetto "fantasma/opaco"; unità risaltate con contorni solidi ad alto contrasto e pavimento bilanciato.
            - **24 Abilità di Livello Uniche & Varie**: Espanso l'albero perk da 8 a 24 abilità (Lame Orbitali, Scudo Energetico, Fulmini a Catena, Munizioni Smart, Fuoco a 360°, Criogenia, Vampirismo) con pesi bilanciati per evitare ripetizioni.
            - **Logo 3D HD, Entrata Studio & Rarità Chiare**.
            - Scarica **`V-Punk-v1.5.${{ github.run_number }}.apk`** qui sotto sul tuo smartphone Android ed aprilo per installare e giocare!
          files: |
            build/android/V-Punk-v1.5.${{ github.run_number }}.apk
            build/android/V-Punk.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
